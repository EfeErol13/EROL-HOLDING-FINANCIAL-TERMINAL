<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EROL HOLDING - EXECUTIVE TYCOON v2.0</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #08080c;
      --panel: #111118;
      --border: rgba(212, 175, 55, 0.3);
      --gold: #d4af37;
      --gold-bright: #fff0a5;
      --white: #f5f5f5;
      --gray: #888899;
      --green: #00ff88;
      --red: #ff3366;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--white); padding: 15px; min-height: 100vh; overflow-x: hidden; }

    /* Header & Status */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1rem; letter-spacing: 3px; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 10px; }
    .pulse-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 10px var(--green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    .rank-badge { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold-bright); padding: 4px 10px; border-radius: 4px; font-family: monospace; font-size: 0.75rem; letter-spacing: 1px; }

    /* Vault & Financial Hub */
    .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin: 15px 0; }
    .main-vault { background: linear-gradient(135deg, #14141e 0%, #0a0a10 100%); border: 1px solid var(--border); border-radius: 6px; padding: 20px; position: relative; overflow: hidden; }
    .vault-title { font-size: 0.7rem; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; }
    .vault-amount { font-size: 2.5rem; font-family: monospace; color: var(--gold-bright); text-shadow: 0 0 15px rgba(212, 175, 55, 0.2); margin: 8px 0; }
    .vault-stats { display: flex; gap: 20px; font-family: monospace; font-size: 0.8rem; }
    .stat-green { color: var(--green); }
    .stat-red { color: var(--red); }

    /* Banka & Kredi Paneli */
    .bank-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
    .panel-title { font-size: 0.75rem; color: var(--gold); letter-spacing: 1.5px; font-weight: bold; margin-bottom: 10px; }

    /* Grafik Konteyneri */
    .chart-container { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 15px; margin-bottom: 15px; height: 200px; }

    /* Borsa Haberleri Ticker */
    .ticker-tape { background: #000; border: 1px solid var(--border); border-radius: 4px; padding: 10px; font-family: monospace; font-size: 0.8rem; color: var(--gold-bright); text-align: center; margin-bottom: 15px; }

    /* Sekme Menüsü */
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--gray); padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.3s; font-size: 0.8rem; letter-spacing: 1px; }
    .tab-btn.active, .tab-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }

    /* Kart Izgaraları */
    .tab-content { display: none; }
    .tab-content.active { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
    .card:hover { border-color: var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.1); }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title { font-weight: bold; font-size: 0.9rem; }
    .card-count { color: var(--gold); font-family: monospace; font-size: 0.85rem; }
    .card-info { font-size: 0.75rem; color: var(--gray); font-family: monospace; margin-bottom: 12px; line-height: 1.4; }

    /* Butonlar */
    .btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-weight: bold; font-size: 0.75rem; cursor: pointer; border-radius: 4px; transition: 0.2s; font-family: monospace; width: 100%; text-align: center; }
    .btn:hover:not(:disabled) { background: var(--gold); color: #000; }
    .btn:disabled { border-color: #333; color: #444; cursor: not-allowed; }
    .btn-red { border-color: var(--red); color: var(--red); }
    .btn-red:hover:not(:disabled) { background: var(--red); color: #fff; }

    footer { display: flex; justify-content: space-between; padding-top: 15px; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--gray); font-family: monospace; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="pulse-dot"></div>
      EROL HOLDING EXECUTIVE TERMINAL v2.0
    </div>
    <div class="rank-badge" id="player-rank">STAJYER YATIRIMCI</div>
  </header>

  <!-- Ana Borsa & Bakiye Ekranı -->
  <div class="dashboard-grid">
    <div class="main-vault">
      <div class="vault-title">TOPLAM NET SERVET</div>
      <div class="vault-amount" id="balance-display">$10,000</div>
      <div class="vault-stats">
        <div>PASİF GELİR: <span class="stat-green" id="income-display">+$0/sn</span></div>
        <div>KREDİ BORCU: <span class="stat-red" id="debt-display">$0</span></div>
      </div>
    </div>

    <!-- Banka Kreditörü -->
    <div class="bank-panel">
      <div class="panel-title">MERKEZ BANKASI KREDİSİ</div>
      <div style="font-size:0.75rem; color:var(--gray); font-family:monospace; margin-bottom:8px;" id="loan-info">Limit: $50,000</div>
      <button class="btn" id="take-loan-btn" onclick="takeLoan()">$25,000 KREDİ ÇEK</button>
      <button class="btn btn-red" style="margin-top:5px;" onclick="payLoan()">KREDİ ÖDE ($25,000)</button>
    </div>
  </div>

  <!-- Live Chart (Canlı Hisse Grafiği) -->
  <div class="chart-container">
    <canvas id="marketChart"></canvas>
  </div>

  <!-- Canlı Borsa Ticker -->
  <div class="ticker-tape" id="news-ticker">
    • Piyasalar açıldı. Borsa verileri gerçek zamanlı işleniyor...
  </div>

  <!-- Sekmeler -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('businesses')">ŞİRKETLERİM</button>
    <button class="tab-btn" onclick="switchTab('executives')">CEO & YÖNETİCİ AĞI</button>
    <button class="tab-btn" onclick="switchTab('investments')">KARABORSA & KRİPTO</button>
  </div>

  <!-- Şirketler Sekmesi -->
  <div class="tab-content active" id="tab-businesses"></div>

  <!-- Yöneticiler Sekmesi -->
  <div class="tab-content" id="tab-executives"></div>

  <!-- Karaborsa / Kripto Sekmesi -->
  <div class="tab-content" id="tab-investments"></div>

  <footer>
    <div>SECURE ENCRYPTION: 1024-BIT SSL</div>
    <div>EMPIRE CORE ENGINE v2.0</div>
  </footer>

  <script>
    // Audio Synthesizer (Ses Efektleri için Dahili Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration, type="sine") {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // Oyun Verileri
    let balance = 10000;
    let debt = 0;
    let maxLoan = 50000;
    let incomePerSec = 0;

    // Şirketler
    const businesses = [
      { id: 'coffee', name: 'Lüks Kahve Zinciri', baseCost: 150, income: 10, count: 0 },
      { id: 'perfume', name: 'Niş Parfüm Evi', baseCost: 1500, income: 90, count: 0 },
      { id: 'tech', name: 'Yazılım & AI Ajansı', baseCost: 15000, income: 800, count: 0 },
      { id: 'crypto', name: 'Kripto Madencilik Tesisi', baseCost: 150000, income: 7500, count: 0 },
      { id: 'bank', name: 'Özel Yatırım Bankası', baseCost: 2000000, income: 85000, count: 0 },
      { id: 'space', name: 'Uzay Roket Sanayii', baseCost: 25000000, income: 950000, count: 0 }
    ];

    // Yöneticiler (Geliri katlayan CEO'lar)
    const executives = [
      { id: 'cfo', name: 'Finans Direktörü (CFO)', cost: 50000, boost: 1.2, hired: false, desc: 'Tüm şirket gelirlerini %20 artırır.' },
      { id: 'cto', name: 'Teknoloji Lideri (CTO)', cost: 250000, boost: 1.5, hired: false, desc: 'Tüm şirket gelirlerini %50 artırır.' },
      { id: 'lobby', name: 'Lobi Şirketi Başkanı', cost: 2000000, boost: 2.0, hired: false, desc: 'Tüm şirket gelirlerini 2 katına çıkarır.' }
    ];

    // Karaborsa Yatırımları
    const investments = [
      { id: 'gold_vault', name: 'Külçe Altın Rezervi', cost: 100000, income: 4000, count: 0 },
      { id: 'rare_art', name: 'Nadir Tablo Koleksiyonu', cost: 1000000, income: 45000, count: 0 },
      { id: 'island', name: 'Özel Tropik Ada', cost: 50000000, income: 2500000, count: 0 }
    ];

    // Chart.js Kurulumu
    const ctx = document.getElementById('marketChart').getContext('2d');
    const chartData = [10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000];
    const marketChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['', '', '', '', '', '', '', '', '', ''],
        datasets: [{
          label: 'Holding Değeri ($)',
          data: chartData,
          borderColor: '#d4af37',
          borderWidth: 2,
          backgroundColor: 'rgba(212, 175, 55, 0.05)',
          fill: true,
          tension: 0.4,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { grid: { color: 'rgba(212,175,55,0.05)' }, ticks: { color: '#666' } }
        }
      }
    });

    // Sekme Değiştirme
    function switchTab(tabId) {
      playSound(400, 0.05);
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    // Ünvan Belirleme
    function getRank(val) {
      if (val < 100000) return 'STAJYER YATIRIMCI';
      if (val < 1000000) return 'GİRSİMCİ PATRON';
      if (val < 20000000) return 'HOLDİNG CEO\'SU';
      if (val < 500000000) return 'KÜRESEL MİLYARDER';
      return 'DÜNYA EKONOMİ LİDERİ';
    }

    // Gelir Hesaplama
    function calculateIncome() {
      let baseIncome = businesses.reduce((acc, b) => acc + (b.income * b.count), 0);
      baseIncome += investments.reduce((acc, i) => acc + (i.income * i.count), 0);

      // Yöneticilerin Katran Etkisi
      let multiplier = 1;
      executives.forEach(e => { if (e.hired) multiplier *= e.boost; });

      incomePerSec = baseIncome * multiplier;
    }

    // Arayüz Yenileme
    function render() {
      document.getElementById('balance-display').innerText = '$' + Math.floor(balance).toLocaleString('en-US');
      document.getElementById('income-display').innerText = '+$' + Math.floor(incomePerSec).toLocaleString('en-US') + '/sn';
      document.getElementById('debt-display').innerText = '$' + Math.floor(debt).toLocaleString('en-US');
      document.getElementById('player-rank').innerText = getRank(balance);
      document.getElementById('loan-info').innerText = 'Max Kredi Limiti: $' + Math.floor(maxLoan).toLocaleString('en-US');

      // Şirketler Sekmesi
      const bizContainer = document.getElementById('tab-businesses');
      bizContainer.innerHTML = '';
      businesses.forEach((biz, index) => {
        const cost = Math.floor(biz.baseCost * Math.pow(1.15, biz.count));
        bizContainer.innerHTML += `
          <div class="card">
            <div class="card-head"><span class="card-title">${biz.name}</span><span class="card-count">x${biz.count}</span></div>
            <div class="card-info">Birim Gelir: +$${biz.income}/sn<br>Maliyet: $${cost.toLocaleString('en-US')}</div>
            <button class="btn" ${balance < cost ? 'disabled' : ''} onclick="buyBusiness(${index})">YATIRIM YAP</button>
          </div>
        `;
      });

      // Yöneticiler Sekmesi
      const execContainer = document.getElementById('tab-executives');
      execContainer.innerHTML = '';
      executives.forEach((exec, index) => {
        execContainer.innerHTML += `
          <div class="card">
            <div class="card-head"><span class="card-title">${exec.name}</span><span class="card-count">${exec.hired ? 'BÜNYEMİZDE' : 'BOŞTA'}</span></div>
            <div class="card-info">${exec.desc}<br>Transfer Ücreti: $${exec.cost.toLocaleString('en-US')}</div>
            <button class="btn" ${exec.hired || balance < exec.cost ? 'disabled' : ''} onclick="hireExec(${index})">
              ${exec.hired ? 'İŞE ALINDI' : 'TRANSFER ET'}
            </button>
          </div>
        `;
      });

      // Karaborsa Sekmesi
      const invContainer = document.getElementById('tab-investments');
      invContainer.innerHTML = '';
      investments.forEach((inv, index) => {
        const cost = Math.floor(inv.cost * Math.pow(1.2, inv.count));
        invContainer.innerHTML += `
          <div class="card">
            <div class="card-head"><span class="card-title">${inv.name}</span><span class="card-count">x${inv.count}</span></div>
            <div class="card-info">Saniyelik Getiri: +$${inv.income.toLocaleString('en-US')}<br>Fiyat: $${cost.toLocaleString('en-US')}</div>
            <button class="btn" ${balance < cost ? 'disabled' : ''} onclick="buyInvestment(${index})">VARLIĞI SATIN AL</button>
          </div>
        `;
      });
    }

    // Satın Almalar
    function buyBusiness(i) {
      const biz = businesses[i];
      const cost = Math.floor(biz.baseCost * Math.pow(1.15, biz.count));
      if (balance >= cost) {
        playSound(600, 0.1);
        balance -= cost;
        biz.count++;
        calculateIncome();
        render();
      }
    }

    function hireExec(i) {
      const exec = executives[i];
      if (balance >= exec.cost && !exec.hired) {
        playSound(800, 0.15);
        balance -= exec.cost;
        exec.hired = true;
        calculateIncome();
        render();
      }
    }

    function buyInvestment(i) {
      const inv = investments[i];
      const cost = Math.floor(inv.cost * Math.pow(1.2, inv.count));
      if (balance >= cost) {
        playSound(500, 0.1);
        balance -= cost;
        inv.count++;
        calculateIncome();
        render();
      }
    }

    // Banka İşlemleri
    function takeLoan() {
      if (debt === 0) {
        playSound(300, 0.2, "square");
        balance += 25000;
        debt = 30000; // Faizli geri ödeme
        render();
      }
    }

    function payLoan() {
      if (balance >= debt && debt > 0) {
        playSound(700, 0.15);
        balance -= debt;
        debt = 0;
        render();
      }
    }

    // Oyun Döngüsü
    setInterval(() => {
      balance += incomePerSec;
      maxLoan = Math.max(50000, balance * 2);

      // Grafiği Güncelle
      chartData.shift();
      chartData.push(balance);
      marketChart.update();

      render();
    }, 1000);

    // Borsa Şok Olayları
    const events = [
      { text: "• YAZILIM KRİZİ: AI şirketleri değer kaybetti!", effect: () => balance *= 0.95 },
      { text: "• KRİPTO BOĞA SEZONU: Tüm kasaya %10 nakit girdi!", effect: () => balance *= 1.10 },
      { text: "• HÜKÜMET TEŞVİK HİBESİ: Bankanıza $50,000 yatırıldı!", effect: () => balance += 50000 }
    ];

    setInterval(() => {
      if (incomePerSec > 0) {
        const ev = events[Math.floor(Math.random() * events.length)];
        document.getElementById('news-ticker').innerText = ev.text;
        ev.effect();
        playSound(200, 0.3, "sawtooth");
        render();
      }
    }, 15000);

    // Başlat
    calculateIncome();
    render();
  </script>
</body>
</html>
